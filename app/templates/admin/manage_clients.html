{% extends "base.html" %}

{% block content %}
<div class="admin-section">
    <h1>Manage Clients</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Reservations</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for client in clients %}
            <tr>
                <td>{{ client.id }}</td>
                <td>{{ client.username }}</td>
                <td>{{ client.email }}</td>
                <td>{{ client.reservations.count() }}</td>
                <td>
                    <a href="{{ url_for('admin.edit_client', id=client.id) }}" class="btn btn-small">Edit</a>
                    <form action="{{ url_for('admin.delete_client', id=client.id) }}" method="post" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this client? All their reservations will be affected.');">
                        <button type="submit" class="btn btn-small btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="5">No clients found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
